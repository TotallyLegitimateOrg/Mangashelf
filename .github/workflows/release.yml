name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install workspace dependencies
        run: make bootstrap

      - name: Build release web assets
        run: bun run build:web

      - name: Build release extension assets
        run: bun run build:extension

      - name: Build packaged binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA}"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          OUTPUT_DIR="dist/${GOOS}_${GOARCH}"
          mkdir -p "$OUTPUT_DIR"

          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi

          go build \
            -tags release \
            -trimpath \
            -ldflags="-s -w -X github.com/TotallyLegitimateOrg/Mangashelf/internal/buildinfo.Version=${VERSION} -X github.com/TotallyLegitimateOrg/Mangashelf/internal/buildinfo.Commit=${COMMIT} -X github.com/TotallyLegitimateOrg/Mangashelf/internal/buildinfo.BuiltAt=${BUILT_AT}" \
            -o "${OUTPUT_DIR}/mangashelf${EXT}" \
            ./cmd/mangashelf

      - name: Archive release artifact
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          OUTPUT_DIR="dist/${{ matrix.goos }}_${{ matrix.goarch }}"
          ARCHIVE_DIR="dist/release"
          mkdir -p "$ARCHIVE_DIR"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            ARCHIVE_NAME="mangashelf_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
            (
              cd "$OUTPUT_DIR"
              zip -q "$GITHUB_WORKSPACE/$ARCHIVE_DIR/$ARCHIVE_NAME" "mangashelf.exe"
            )
          else
            ARCHIVE_NAME="mangashelf_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
            tar -C "$OUTPUT_DIR" -czf "$ARCHIVE_DIR/$ARCHIVE_NAME" "mangashelf"
          fi

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
