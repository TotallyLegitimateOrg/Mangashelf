name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install workspace dependencies
        run: make bootstrap

      - name: Run full validation suite
        run: make test

      - name: Verify generated SQLC code is up to date
        run: |
          make sqlc
          git diff --exit-code -- internal/db/gen

      - name: Verify release binary compiles
        run: go build -tags release -trimpath -o /tmp/mangashelf ./cmd/mangashelf
